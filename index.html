  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #75695A;\">v0.1 · MIT<\/span>\n      <\/div>\n      <div style=\"flex: 1;\"><\/div>\n      <a href=\"#tutorial\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #75695A; text-decoration: none; padding: 6px 0;\" style-hover=\"color: #1C1A17\">tutorial<\/a>\n      <a href=\"#tools\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #75695A; text-decoration: none; padding: 6px 0;\" style-hover=\"color: #1C1A17\">tools<\/a>\n      <a href=\"#workflow\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #75695A; text-decoration: none; padding: 6px 0;\" style-hover=\"color: #1C1A17\">workflow<\/a>\n      <a href=\"https://github.com/denkiwakame/nanokit\" target=\"_blank\" rel=\"noopener\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #1C1A17; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(28,26,23,0.18); border-radius: 6px;\" style-hover=\"background: #1C1A17; color: #EFEAE0; border-color: #1C1A17\">github  ↗<\/a>\n    <\/div>\n  <\/nav>\n\n  <!-- ============================ HERO ============================ -->\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px 64px; position: relative;\">\n\n    <!-- ascii brand -->\n    <pre style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(6px, 1.05vw, 12px); line-height: 1.05; color: {{ accent }}; margin: 0 0 48px; white-space: pre; overflow-x: auto; opacity: 1; letter-spacing: 0;\">                                                   88         88\n                                                   88         \"\"    ,d\n                                                   88               88\n8b,dPPYba,   ,adPPYYba,  8b,dPPYba,    ,adPPYba,   88   ,d8   88  MM88MMM\n88P'   `\"8a  \"\"     `Y8  88P'   `\"8a  a8\"     \"8a  88 ,a8\"    88    88\n88       88  ,adPPPPP88  88       88  8b       d8  8888[      88    88\n88       88  88,    ,88  88       88  \"8a,   ,a8\"  88`\"Yba,   88    88,\n88       88  `\"8bbdP\"Y8  88       88   `\"YbbdP\"'   88   `Y8a  88    \"Y888<\/pre>\n\n    <!-- eyebrow -->\n    <div style=\"display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #75695A; margin-bottom: 28px; letter-spacing: 0.04em; text-transform: uppercase;\">\n      <span style=\"display: inline-block; width: 24px; height: 1px; background: #75695A;\"><\/span>\n      <span>a minimal dev environment, powered by pixi<\/span>\n    <\/div>\n\n    <!-- big serif headline -->\n    <h1 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: clamp(32px, 4.4vw, 58px); line-height: 1.12; letter-spacing: -0.045em; margin: 0 0 28px; max-width: 980px; text-wrap: balance;\">\n      Your whole dev setup,<br>\n      <em style=\"font-style: italic; color: {{ accent }};\">user-local<\/em>, <em style=\"font-style: italic; color: #75695A;\">declarative<\/em>,<br>\n      and one command away.\n    <\/h1>\n\n    <p style=\"font-size: 19px; line-height: 1.55; color: #443E36; max-width: 620px; margin: 0 0 40px; text-wrap: pretty;\">\n      Cross-platform. No <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">sudo<\/code> required. 28 tools installed to <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">~/.pixi<\/code>, dotfiles symlinked via <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">dotter<\/code>, shell wired with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">sheldon<\/code>+<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">starship<\/code>. Type <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">./nanokit install<\/code> and walk away.\n    <\/p>\n\n    <!-- CTAs -->\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 48px;\">\n      <a href=\"#tutorial\" style=\"display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; padding: 14px 22px; background: #1C1A17; color: #EFEAE0; text-decoration: none; border-radius: 8px; transition: transform 0.15s;\" style-hover=\"transform: translateY(-1px); background: #2A2622\">\n        <span style=\"color: {{ accent }};\">$<\/span>\n        <span>./try-nanokit<\/span>\n        <span style=\"color: #8A8170;\">↓<\/span>\n      <\/a>\n      <a href=\"https://github.com/denkiwakame/nanokit\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; padding: 14px 22px; background: transparent; color: #1C1A17; text-decoration: none; border: 1px solid rgba(28,26,23,0.2); border-radius: 8px;\" style-hover=\"background: rgba(28,26,23,0.04); border-color: rgba(28,26,23,0.4)\">\n        <span>★<\/span>\n        <span>github.com/denkiwakame/nanokit<\/span>\n      <\/a>\n    <\/div>\n\n    <!-- meta strip -->\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px 32px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A; padding-top: 32px; border-top: 1px solid rgba(28,26,23,0.1);\">\n      <span><span style=\"color: {{ accent }};\">●<\/span> Linux x86 / arm<\/span>\n      <span><span style=\"color: {{ accent }};\">●<\/span> macOS<\/span>\n      <span><span style=\"color: {{ accent }};\">●<\/span> WSL<\/span>\n      <span style=\"color: #BFB4A3;\">·<\/span>\n      <span>no sudo<\/span>\n      <span>~/.pixi<\/span>\n      <span>28 tools<\/span>\n      <span>MIT license<\/span>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ FEATURE STRIP ============================ -->\n  <sc-if value=\"{{ showFeatures }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 24px 32px 96px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(28,26,23,0.12); border: 1px solid rgba(28,26,23,0.12); border-radius: 4px; overflow: hidden;\">\n      <div style=\"background: #EFEAE0; padding: 28px 24px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A; margin-bottom: 14px; letter-spacing: 0.06em;\">01 / FAST<\/div>\n        <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 18px; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.03em;\">Cross-platform by design.<\/div>\n        <div style=\"font-size: 13px; color: #6A6055; line-height: 1.5;\">Linux (x86 / arm64), macOS, WSL — same setup, same tools, same lockfile.<\/div>\n      <\/div>\n      <div style=\"background: #EFEAE0; padding: 28px 24px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A; margin-bottom: 14px; letter-spacing: 0.06em;\">02 / SAFE<\/div>\n        <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 18px; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.03em;\">No sudo, no system rot.<\/div>\n        <div style=\"font-size: 13px; color: #6A6055; line-height: 1.5;\">Every binary lives under <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.85em;\">$HOME/.pixi<\/code>. Your OS stays untouched.<\/div>\n      <\/div>\n      <div style=\"background: #EFEAE0; padding: 28px 24px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A; margin-bottom: 14px; letter-spacing: 0.06em;\">03 / DECLARATIVE<\/div>\n        <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 18px; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.03em;\">Toolbox as a manifest.<\/div>\n        <div style=\"font-size: 13px; color: #6A6055; line-height: 1.5;\"><code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.85em;\">pixi-global.toml<\/code> describes your shell — commit it, share it, sync it.<\/div>\n      <\/div>\n      <div style=\"background: #EFEAE0; padding: 28px 24px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A; margin-bottom: 14px; letter-spacing: 0.06em;\">04 / COZY<\/div>\n        <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 18px; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.03em;\">Shell that feels good.<\/div>\n        <div style=\"font-size: 13px; color: #6A6055; line-height: 1.5;\">zsh + sheldon + starship + tmux, preconfigured. Plus a 7-day supply-chain cooldown on npm and uv.<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n  <\/sc-if>\n\n  <!-- ============================ TUTORIAL ============================ -->\n  <section id=\"tutorial\" style=\"background: #E7E0D2; border-top: 1px solid rgba(28,26,23,0.1); border-bottom: 1px solid rgba(28,26,23,0.1); padding: 96px 0;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 32px;\">\n\n      <!-- section title -->\n      <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{ accent }}; letter-spacing: 0.06em;\">§ 01<\/span>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #75695A; letter-spacing: 0.06em;\">— THE TUTORIAL<\/span>\n      <\/div>\n      <h2 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: clamp(26px, 3.6vw, 46px); line-height: 1.12; letter-spacing: -0.045em; margin: 0 0 16px; max-width: 820px;\">\n        From <em style=\"color: #75695A;\">zero<\/em> to nanokit<br>in four commands.\n      <\/h2>\n      <p style=\"font-size: 17px; color: #443E36; max-width: 620px; margin: 0 0 64px;\">\n        Copy along. Each step has a copy button — click and paste. Pick your platform when it matters; the rest works everywhere.\n      <\/p>\n\n      <!-- ─────────────── STEP 01 — install pixi ─────────────── -->\n      <div id=\"step-1\" style=\"scroll-margin-top: 80px; margin-bottom: 80px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.04em;\">STEP 01<\/span>\n          <span style=\"flex: 1; height: 1px; background: rgba(28,26,23,0.15);\"><\/span>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A;\">~30 sec<\/span>\n        <\/div>\n        <h3 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 26px; line-height: 1.2; letter-spacing: -0.04em; margin: 0 0 12px;\">Install pixi.<\/h3>\n        <p style=\"font-size: 16px; color: #443E36; margin: 0 0 24px; max-width: 640px;\">\n          Pixi is the only thing you install <em>globally<\/em>. From there it manages everything else — git, zsh, neovim, the works.\n        <\/p>\n\n        <!-- tabs -->\n        <div style=\"display: inline-flex; padding: 4px; background: rgba(28,26,23,0.06); border-radius: 8px; margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\">\n          <button onclick=\"{{ setCurl }}\" style=\"{{ curlTabStyle }}\">curl<\/button>\n          <button onclick=\"{{ setWget }}\" style=\"{{ wgetTabStyle }}\">wget<\/button>\n        <\/div>\n\n        <!-- terminal block: curl -->\n        <sc-if value=\"{{ isCurl }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #16140F; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 40px -20px rgba(28,26,23,0.25), 0 2px 0 rgba(28,26,23,0.04);\">\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #1F1C16; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n            <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n            <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">~ — zsh<\/div>\n            <button data-copy=\"curl -fsSL https://pixi.sh/install.sh | sh\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px 10px; cursor: pointer;\" style-hover=\"color: #E7DFCF; border-color: rgba(255,255,255,0.25)\">copy<\/button>\n          <\/div>\n          <pre style=\"margin: 0; padding: 22px 24px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #E7DFCF; overflow-x: auto;\"><span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> curl -fsSL https://pixi.sh/install.sh | sh\n<span style=\"color: #8A8170;\">  ⏳ downloading pixi v0.67.0…<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ installed to <\/span><span style=\"color: #E6B450;\">~/.pixi/bin/pixi<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ added <\/span><span style=\"color: #E6B450;\">~/.pixi/bin<\/span><span style=\"color: #8A8170;\"> to PATH (via ~/.zshrc)<\/span><br><br>\n<span style=\"color: #C8868A;\"># now restart your shell, or:<\/span><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> source ~/.zshrc <span style=\"color: #8A8170;\">&amp;&amp;<\/span> pixi --version\npixi 0.67.0<span style=\"display: inline-block; width: 8px; height: 16px; background: #E7DFCF; margin-left: 4px; vertical-align: -3px; animation: nk-blink 1s infinite step-end;\"><\/span><\/pre>\n        <\/div>\n        <\/sc-if>\n\n        <!-- terminal block: wget -->\n        <sc-if value=\"{{ isWget }}\">\n        <div style=\"background: #16140F; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 40px -20px rgba(28,26,23,0.25), 0 2px 0 rgba(28,26,23,0.04);\">\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #1F1C16; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n            <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n            <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">~ — zsh<\/div>\n            <button data-copy=\"wget -qO- https://pixi.sh/install.sh | sh\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px 10px; cursor: pointer;\" style-hover=\"color: #E7DFCF; border-color: rgba(255,255,255,0.25)\">copy<\/button>\n          <\/div>\n          <pre style=\"margin: 0; padding: 22px 24px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #E7DFCF; ove adius: 50%; background: #61C554;\"><\/span><\/div>\n            <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">~ — git clone<\/div>\n            <button data-copy=\"git clone https://github.com/denkiwakame/nanokit.git\ncd nanokit\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px 10px; cursor: pointer;\" style-hover=\"color: #E7DFCF; border-color: rgba(255,255,255,0.25)\">copy<\/button>\n          <\/div>\n          <pre style=\"margin: 0; padding: 22px 24px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #E7DFCF; overflow-x: auto;\"><span style=\"color: #C8868A;\"># no gh? plain git works fine:<\/span><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> git clone https://github.com/denkiwakame/nanokit.git\n<span style=\"color: #8A8170;\">  Cloning into 'nanokit'…<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ done.<\/span><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> cd nanokit<span style=\"display: inline-block; width: 8px; height: 16px; background: #E7DFCF; margin-left: 4px; vertical-align: -3px; animation: nk-blink 1s infinite step-end;\"><\/span><\/pre>\n        <\/div>\n        <\/sc-if>\n      <\/div>\n\n      <!-- ─────────────── STEP 03 — install ─────────────── -->\n      <div id=\"step-3\" style=\"scroll-margin-top: 80px; margin-bottom: 80px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.04em;\">STEP 03<\/span>\n          <span style=\"flex: 1; height: 1px; background: rgba(28,26,23,0.15);\"><\/span>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A;\">~2 min<\/span>\n        <\/div>\n        <h3 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 26px; line-height: 1.2; letter-spacing: -0.04em; margin: 0 0 12px;\">Install nanokit.<\/h3>\n        <p style=\"font-size: 16px; color: #443E36; margin: 0 0 24px; max-width: 640px;\">\n          Two flavors. <strong style=\"font-weight: 600;\">Auto<\/strong> is one command for a fresh box. <strong style=\"font-weight: 600;\">Manual<\/strong> is what to run if you already have a curated shell you want to keep.\n        <\/p>\n\n        <div style=\"display: inline-flex; padding: 4px; background: rgba(28,26,23,0.06); border-radius: 8px; margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px;\">\n          <button onclick=\"{{ setAuto }}\" style=\"{{ autoTabStyle }}\">3-a · auto (fresh box)<\/button>\n          <button onclick=\"{{ setManual }}\" style=\"{{ manualTabStyle }}\">3-b · manual<\/button>\n        <\/div>\n\n        <!-- auto -->\n        <sc-if value=\"{{ isAuto }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #16140F; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 40px -20px rgba(28,26,23,0.25);\">\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #1F1C16; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n            <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n            <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">~/nanokit — installer<\/div>\n            <button data-copy=\"./nanokit install\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px 10px; cursor: pointer;\" style-hover=\"color: #E7DFCF; border-color: rgba(255,255,255,0.25)\">copy<\/button>\n          <\/div>\n          <pre style=\"margin: 0; padding: 22px 24px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #E7DFCF; overflow-x: auto;\"><span style=\"color: #A8C97F;\">~/nanokit<\/span> <span style=\"color: {{ accent }};\">❯<\/span> ./nanokit install\n\n<span style=\"color: {{ accent }};\">━━━━━ nanokit installer ━━━━━<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ pixi found (v0.67.0)<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ installing dotter-rs<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ dotter deploy → 14 symlinks created<\/span><br>\n<span style=\"color: #8A8170;\">    └─ ~/.zshrc, ~/.tmux.conf, ~/.config/starship.toml, …<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ pixi global sync → 28 tools installed<\/span><br>\n<span style=\"color: #8A8170;\">    └─ git, gh, zsh, sheldon, starship, tmux, neovim, …<\/span><br><br>\n<span style=\"color: #A8C97F;\">  🎉 nanokit is ready. start a new shell:<\/span><br>\n<span style=\"color: #A8C97F;\">~/nanokit<\/span> <span style=\"color: {{ accent }};\">❯<\/span> zsh<span style=\"display: inline-block; width: 8px; height: 16px; background: #E7DFCF; margin-left: 4px; vertical-align: -3px; animation: nk-blink 1s infinite step-end;\"><\/span><\/pre>\n        <\/div>\n\n        <div style=\"margin-top: 20px; padding: 16px 20px; background: rgba(204, 120, 92, 0.1); border-left: 3px solid {{ accent }}; border-radius: 4px; font-size: 13.5px; color: #5A3A2A; line-height: 1.6;\">\n          <strong style=\"font-weight: 600;\">⚠ A word on login shells.<\/strong> nanokit uses its <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.08); padding: 1px 5px; border-radius: 3px;\">~/.pixi<\/code> zsh for <em>interactive<\/em> sessions only. Keep your <em>login<\/em> shell as the system one (<code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.08); padding: 1px 5px; border-radius: 3px;\">/usr/bin/zsh<\/code> or <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.08); padding: 1px 5px; border-radius: 3px;\">/bin/bash<\/code>) — if pixi's env breaks, you don't want to lose SSH access.\n        <\/div>\n        <\/sc-if>\n\n        <!-- manual -->\n        <sc-if value=\"{{ isManual }}\">\n        <div style=\"display: grid; gap: 16px;\">\n\n          <div>\n            <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }};\">#1<\/span>\n              <span style=\"font-size: 14px; color: #443E36;\">install dotter<\/span>\n            <\/div>\n            <div style=\"background: #16140F; border-radius: 8px; overflow: hidden;\">\n              <div style=\"display: flex; padding: 8px 14px; background: #1F1C16; align-items: center;\">\n                <div style=\"flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">$<\/div>\n                <button data-copy=\"pixi global install dotter-rs\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 8px; cursor: pointer;\" style-hover=\"color: #E7DFCF\">copy<\/button>\n              <\/div>\n              <pre style=\"margin: 0; padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E7DFCF;\"><span style=\"color: {{ accent }};\">❯<\/span> pixi global install dotter-rs<\/pre>\n            <\/div>\n          <\/div>\n\n          <div>\n            <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }};\">#2<\/span>\n              <span style=\"font-size: 14px; color: #443E36;\">dry-run, then deploy the symlinks<\/span>\n            <\/div>\n            <div style=\"background: #16140F; border-radius: 8px; overflow: hidden;\">\n              <div style=\"display: flex; padding: 8px 14px; background: #1F1C16; align-items: center;\">\n                <div style=\"flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">$<\/div>\n                <button data-copy=\"dotter -d\ndotter deploy\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 8px; cursor: pointer;\" style-hover=\"color: #E7DFCF\">copy<\/button>\n              <\/div>\n              <pre style=\"margin: 0; padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E7DFCF; line-height: 1.7;\"><span style=\"color: {{ accent }};\">❯<\/span> dotter -d        <span style=\"color: #C8868A;\"># dry run: confirm what happens<\/span><br>\n<span style=\"color: {{ accent }};\">❯<\/span> dotter deploy    <span style=\"color: #C8868A;\"># actually symlink them<\/span><\/pre>\n            <\/div>\n          <\/div>\n\n          <div>\n            <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }};\">#3<\/span>\n              <span style=\"font-size: 14px; color: #443E36;\">sync every tool listed in <code style=\"font-family: 'JetBrains Mono', monospace;\">pixi-global.toml<\/code><\/span>\n            <\/div>\n            <div style=\"background: #16140F; border-radius: 8px; o 3.6vw, 46px); line-height: 1.12; letter-spacing: -0.045em; margin: 0 0 16px; max-width: 820px;\">\n      28 tools, <em style=\"color: {{ accent }};\">declared<\/em><br>in one TOML file.\n    <\/h2>\n    <p style=\"font-size: 17px; color: #443E36; max-width: 620px; margin: 0 0 48px;\">\n      Everything below installs to <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.92em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">~/.pixi/envs/&lt;tool&gt;<\/code> with its own dependencies locked. Want one more? <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.92em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">pixi global install &lt;name&gt;<\/code> — done.\n    <\/p>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: rgba(28,26,23,0.1); border: 1px solid rgba(28,26,23,0.1); border-radius: 4px; overflow: hidden;\">\n\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: #1C1A17;\"><span style=\"color: #B5A88F; font-weight: 400;\">🔀<\/span> git<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">version control system<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🐙<\/span> gh<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">github CLI · auth + clone<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🔀<\/span> git-lfs<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">large file storage for git<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🔀<\/span> tig<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">TUI git log + diff browser<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🐚<\/span> zsh<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">the interactive shell<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🎩<\/span> sheldon<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">zsh plugin manager<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🚀<\/span> starship<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">minimal prompt, any shell<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🦀<\/span> dotter-rs<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">dotfile symlink manager<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🔐<\/span> sshs<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">TUI ssh-config picker<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📊<\/span> htop<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">interactive process viewer<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📊<\/span> btm · bottom<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">richer system monitor<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🔎<\/span> fzf<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">universal fuzzy finder<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📁<\/span> tree<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">directory tree printer<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">📁<\/span> ghq<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">organize cloned repos<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🌲<\/span> gwq<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">ghq-style worktree manager<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🌀<\/span> zoxide<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">smarter cd / dir jumper<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🛠️<\/span> make<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">old-school task runner<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📋<\/span> xsel<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">x11 clipboard bridge<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🗄️<\/span> pueue<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">local background job queue<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: {{ accent }}; font-weight: 400;\">🪟<\/span> tmux<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">terminal multiplexer<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">💽<\/span> dua<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">interactive disk usage<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">💽<\/span> diskonaut<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">visual disk navigator<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🦇<\/span> bat<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">cat with syntax highlighting<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📂<\/span> lsd<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">modern ls with icons<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">⚙️<\/span> node · npm · npx<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">node.js runtime<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">⚙️<\/span> jq<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">command-line JSON<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">🌍<\/span> xh<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">friendly HTTP requests<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">☁️<\/span> rclone<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">rsync for cloud storage<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">☁️<\/span> aws<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">aws cli + completer<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📝<\/span> nvim<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">neovim · node/lua/py support<\/div><\/div>\n      <div style=\"background: #EFEAE0; padding: 18px 20px;\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;\"><span style=\"color: #B5A88F; font-weight: 400;\">📝<\/span> hx · helix<\/div><div style=\"font-size: 12px; color: #75695A; line-height: 1.4; margin-top: 4px;\">post-modern modal editor<\/div><\/div>\n\n      <!-- \"add your own\" -->\n      <div style=\"background: #1C1A17; color: #EFEAE0; padding: 18px 20px; cursor: default;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: {{ accent }};\">+ your tool here<\/div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; line-height: 1.5; margin-top: 6px;\">pixi global install &lt;name&gt;<\/div>\n      <\/div>\n    <\/div>\n\n    <!-- supply chain cooldown callout -->\n    <div style=\"margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;\">\n      <div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }}; letter-spacing: 0.06em; margin-bottom: 12px;\">SECURITY · COOLDOWN<\/div>\n        <h3 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 22px; line-height: 1.25; margin: 0 0 12px; letter-spacing: -0.04em;\">A 7-day cushion against<br>compromised packages.<\/h3>\n        <p style=\"font-size: 15px; color: #443E36; line-height: 1.6; margin: 0;\">nanokit ships <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">npmrc<\/code> and <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">uv.toml<\/code> with a 7-day release-age cooldown. Compromised packages get caught within hours or days — sit one week behind and the world has already triaged it for you.<\/p>\n      <\/div>\n      <div style=\"background: #16140F; border-radius: 10px; overflow: hidden;\">\n        <div style=\"padding: 12px 16px; background: #1F1C16; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">~/.npmrc · ~/.config/uv/uv.toml<\/span>\n        <\/div>\n        <pre style=\"margin: 0; padding: 18px 22px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: #E7DFCF;\"><span style=\"color: #C8868A;\"># npm v11.10.0+<\/span><br>\n<span style=\"color: #E6B450;\">min-release-age<\/span> = <span style=\"color: #A8C97F;\">7<\/span><br><br>\n<span style=\"color: #C8868A;\"># uv 0.11.2+<\/span><br>\n<span style=\"color: #E6B450;\">exclude-newer<\/span> = <span style=\"color: #A8C97F;\">\"7 days\"<\/span><br><br>\n<span style=\"color: #C8868A;\"># pixi v0.67.0+ (per-workspace only)<\/span><br>\n<span style=\"color: #8A8170;\">[workspace]<\/span><br>\n<span style=\"color: #E6B450;\">exclude-newer<\/span> = <span style=\"color: #A8C97F;\">\"7d\"<\/span><\/pre>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ WORKFLOW: ghq + gwq + zoxide ============================ -->\n  <section id=\"workflow\" style=\"background: #1C1A17; color: #E7DFCF; padding: 96px 0; position: relative; overflow: hidden;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 32px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{ accent }}; letter-spacing: 0.06em;\">§ 03<\/span>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A8170; letter-spacing: 0.06em;\">— THE GOOD COMBO<\/span>\n      <\/div>\n      <h2 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: clamp(28px, 3.8vw, 48px); line-height: 1.1; letter-spacing: -0.045em; margin: 0 0 16px; max-width: 900px; color: #F5EFE3;\">\n        <span style=\"color: {{ accent }};\">ghq<\/span> + <span style=\"color: #A8C97F;\">gwq<\/span> + <span style=\"color: #E6B450;\">zoxide<\/span><br>\n        <em style=\"font-style: italic; color: #B5A88F;\">a magical little workflow.<\/em>\n      <\/h2>\n      <p style=\"font-size: 17px; color: #B5A88F; max-width: 660px; margin: 0 0 56px;\">\n        Three small tools that fit together like puzzle pieces: one organizes repos, one organizes worktrees, one organizes <em>your memory of where things are<\/em>.\n      <\/p>\n\n      <!-- diagram -->\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-bottom: 56px;\">\n\n        <!-- ghq -->\n        <div style=\"background: #14120D; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 24px; position: relative;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }}; letter-spacing: 0.06em; margin-bottom: 12px;\">📦 GHQ · ORGANIZE<\/div>\n          <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 17px; line-height: 1.3; margin-bottom: 16px; letter-spacing: -0.03em; color: #F5EFE3;\">Every repo finds<br>its home.<\/div>\n          <pre style=\"margin: 0 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #E7DFCF; background: #0F0E0A; padding: 14px 16px; border-radius: 6px;\"><span style=\"color: {{ accent }};\">❯<\/span> ghq get user/proj\n<span style=\"color: #8A8170;\">  → $GHQ_ROOT/github.com/<\/span><br>\n<span style=\"color: #8A8170;\">       user/proj<\/span><\/pre>\n          <div style=\"font-size: 13px; color: #8A8170; line-height: 1.55;\">Everything sorted by origin under one root. <code style=\"font-family: 'JetBrains Mono', monospace; color: #B5A88F;\">GHQ_ROOT<\/code> defaults to <code style=\"font-family: 'JetBrains Mono', monospace; color: #B5A88F;\">$HOME/ghq<\/code>.<\/div>\n        <\/div>\n\n        <!-- gwq -->\n        <div style=\"background: #14120D; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 24px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A8C97F; letter-spacing: 0.06em; margin-bottom: 12px;\">🌲 GWQ · BRANCH<\/div>\n          <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 17px; line-height: 1.3; margin-bottom: 16px; letter-spacing: -0.03em; color: #F5EFE3;\">Worktrees, the<br>ghq way.<\/div>\n          <pre style=\"margin: 0 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #E7DFCF; background: #0F0E0A; padding: 14px 16px; border-radius: 6px;\"><span style=\"color: #C8868A;\"># gwq add -b feat-x  # if new branch<\/span><br>\n<span style=\"color: {{ accent }};\">❯<\/span> gwq add feat-x\n<span style=\"color: #8A8170;\">  → $GHQ_ROOT/github.com/<\/span><br>\n<span style=\"color: #8A8170;\">       user/proj.feat-x<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ auto-cd into it.<\/span><\/pre>\n          <div style=\"font-size: 13px; color: #8A8170; line-height: 1.55;\">Worktrees as siblings of the repo — ghq-style layout, same root.<\/div>\n        <\/div>\n\n        <!-- zoxide -->\n        <div style=\"background: #14120D; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 24px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #E6B450; letter-spacing: 0.06em; margin-bottom: 12px;\">🌀 ZOXIDE · REMEMBER<\/div>\n          <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 17px; line-height: 1.3; margin-bottom: 16px; letter-spacing: -0.03em; color: #F5EFE3;\">cd that learns<br>where you live.<\/div>\n          <pre style=\"margin: 0 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #E7DFCF; background: #0F0E0A; padding: 14px 16px; border-radius: 6px;\"><span style=\"color: {{ accent }};\">❯<\/span> z proj\n<span style=\"color: #8A8170;\">  → jump to the matching dir.<\/span><br>\n<span style=\"color: {{ accent }};\">❯<\/span> zi\n<span style=\"color: #8A8170;\">  → fuzzy interactive picker.<\/span><\/pre>\n          <div style=\"font-size: 13px; color: #8A8170; line-height: 1.55;\">No more <code style=\"font-family: 'JetBrains Mono', monospace; color: #B5A88F;\">cd ../../../<\/code>. Just <code style=\"font-family: 'JetBrains Mono', monospace; color: #B5A88F;\">zi<\/code> and you're there.<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- single mega-terminal showing all 3 in action -->\n      <div style=\"background: #0F0E0A; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06);\">\n        <div style=\"display: flex; align-items: center; gap: 8px; padding: 14px 18px; background: #14120D; border-bottom: 1px solid rgba(255,255,255,0.06);\">\n          <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n          <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">zsh<\/div>\n        <\/div>\n        <pre style=\"margin: 0; padding: 28px 32px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.85; color: #E7DFCF; overflow-x: auto;\"><span style=\"color: #C8868A;\"># GHQ_ROOT defaults to $HOME/ghq<\/span><br><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> ghq get https://github.com/denkiwakame/pixi-tex\n<span style=\"color: #8A8170;\">  ✓ cloned to $GHQ_ROOT/github.com/denkiwakame/pixi-tex<\/span><br><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> cd ~/ghq/github.com/denkiwakame/pixi-tex\n<span style=\"color: #C8868A;\"># once cd, zoxide remembers this path<\/span><br><br>\n<span style=\"color: #A8C97F;\">~<\/span> <span style=\"color: {{ accent }};\">❯<\/span> z pixi-tex\n<span style=\"color: #A8C97F;\">$GHQ_ROOT/github.com/denkiwakame/pixi-tex<\/span> <span style=\"color: {{ accent }};\">❯<\/span> _\n\n<span style=\"color: #C8868A;\"># spin a worktree for a feature branch:<\/span><br><br>\n<span style=\"color: #A8C97F;\">$GHQ_ROOT/github.com/denkiwakame/pixi-tex<\/span> <span style=\"color: {{ accent }};\">❯<\/span> gwq add feat-x\n<span style=\"color: #C8868A;\">  # gwq add -b feat-x  # if new branch<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ $GHQ_ROOT/github.com/denkiwakame/pixi-tex.feat-x<\/span><br>\n<span style=\"color: #8A8170;\">  ✓ auto-cd into the new worktree<\/span><\/pre>\n      <\/div>\n\n      <!-- zi picker mock -->\n      <div style=\"margin-top: 24px; background: #0F0E0A; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06);\">\n        <div style=\"display: flex; align-items: center; gap: 8px; padding: 14px 18px; background: #14120D; border-bottom: 1px solid rgba(255,255,255,0.06);\">\n          <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n          <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">zi — fuzzy interactive picker<\/div>\n        <\/div>\n        <pre style=\"margin: 0; padding: 22px 26px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #E7DFCF; overflow-x: auto;\"><span style=\"color: #8A8170;\">&lt; 13/13<\/span><br>\n<span style=\"color: #A8C97F;\">▌<\/span> <span style=\"background: rgba(168,201,127,0.14); color: #E7DFCF; padding: 0 2px;\">$GHQ_ROOT/github.com/denkiwakame/pixi-tex<\/span><br>\n<span style=\"color: #8A8170;\">  $GHQ_ROOT/github.com/denkiwakame/nanokit<\/span><br>\n<span style=\"color: #8A8170;\">  $GHQ_ROOT/github.com/denkiwakame/dotfiles<\/span><br>\n<span style=\"color: #8A8170;\">  $GHQ_ROOT/github.com/anthropics/claude-skills<\/span><br>\n<span style=\"color: #8A8170;\">  $GHQ_ROOT/github.com/denkiwakame/pixi-tex.feat-x<\/span><br><br>\n<span style=\"color: #8A8170;\">&gt; <\/span><br>\n<br>\n<span style=\"color: #8A8170;\">&lt; 1/13<\/span><br>\n<span style=\"color: #A8C97F;\">▌<\/span> <span style=\"background: rgba(168,201,127,0.14); color: #E7DFCF; padding: 0 2px;\">$GHQ_ROOT/github.com/denkiwakame/nanokit<\/span><br><br>\n<span style=\"color: #8A8170;\">&gt; <\/span><span style=\"color: #E7DFCF;\">nano<\/span><span style=\"display: inline-block; width: 8px; height: 16px; background: #E7DFCF; margin-left: 2px; vertical-align: -3px; animation: nk-blink 1s infinite step-end;\"><\/span><\/pre>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ TMUX CHEATSHEET ============================ -->\n  <sc-if value=\"{{ showCheatsheet }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"tmux\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{ accent }}; letter-spacing: 0.06em;\">§ 04<\/span>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #75695A; letter-spacing: 0.06em;\">— TMUX CHEATSHEET<\/span>\n    <\/div>\n    <h2 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: clamp(24px, 3.4vw, 42px); line-height: 1.12; letter-spacing: -0.045em; margin: 0 0 16px; max-width: 820px;\">\n      Minimal tmux key bindings <span style=\"white-space: nowrap;\">w/ <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: #1C1A17; color: #E7DFCF; padding: 4px 12px; border-radius: 6px; vertical-align: 6px;\">Ctrl+a<\/code>.<\/span>\n    <\/h2>\n    <p style=\"font-size: 16px; color: #443E36; max-width: 620px; margin: 0 0 40px;\">\n      <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.06); padding: 2px 6px; border-radius: 4px;\">Ctrl+a ?<\/code> shows the full list inside tmux at any time.\n    <\/p>\n\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px 48px;\">\n\n      <div>\n        <h4 style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.06em; margin: 0 0 16px;\">BASIC<\/h4>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; font-size: 14px;\">\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a ?<\/code><span style=\"color: #443E36; align-self: center;\">show all key bindings<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a r<\/code><span style=\"color: #443E36; align-self: center;\">reload tmux config<\/span>\n        <\/div>\n      <\/div>\n\n      <div>\n        <h4 style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.06em; margin: 0 0 16px;\">WINDOWS<\/h4>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; font-size: 14px;\">\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a c<\/code><span style=\"color: #443E36; align-self: center;\">new window (in current dir)<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a w<\/code><span style=\"color: #443E36; align-self: center;\">pick window from list<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a n<\/code><span style=\"color: #443E36; align-self: center;\">next window<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a p<\/code><span style=\"color: #443E36; align-self: center;\">previous window<\/span>\n        <\/div>\n      <\/div>\n\n      <div>\n        <h4 style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.06em; margin: 0 0 16px;\">PANES<\/h4>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; font-size: 14px;\">\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a -<\/code><span style=\"color: #443E36; align-self: center;\">split horizontal<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a |<\/code><span style=\"color: #443E36; align-self: center;\">split vertical<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a h/j/k/l<\/code><span style=\"color: #443E36; align-self: center;\">move between panes (vim-style)<\/span>\n        <\/div>\n      <\/div>\n\n      <div>\n        <h4 style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: {{ accent }}; letter-spacing: 0.06em; margin: 0 0 16px;\">COPY MODE<\/h4>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; font-size: 14px;\">\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">C-a [<\/code><span style=\"color: #443E36; align-self: center;\">enter copy mode<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">v<\/code><span style=\"color: #443E36; align-self: center;\">start selection<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">y<\/code><span style=\"color: #443E36; align-self: center;\">yank selection<\/span>\n          <code style=\"font-family: 'JetBrains Mono', monospace; background: #1C1A17; color: #E7DFCF; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; align-self: start;\">q<\/code><span style=\"color: #443E36; align-self: center;\">exit copy mode<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n  <\/sc-if>\n\n  <!-- ============================ SANDBOX ============================ -->\n  <section id=\"sandbox\" style=\"background: #E7E0D2; border-top: 1px solid rgba(28,26,23,0.1); padding: 96px 0;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 64px; align-items: center;\">\n      <div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{ accent }}; letter-spacing: 0.06em; margin-bottom: 16px;\">§ 05 — SANDBOX<\/div>\n        <h2 style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: clamp(24px, 3.4vw, 42px); line-height: 1.12; letter-spacing: -0.045em; margin: 0 0 16px;\">\n          Try nanokit in<br><em style=\"color: {{ accent }};\">a throwaway user.<\/em>\n        <\/h2>\n        <p style=\"font-size: 16px; color: #443E36; line-height: 1.6; margin: 0 0 14px;\">\n          Don't want to touch your real <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(28,26,23,0.08); padding: 2px 6px; border-radius: 4px;\">$HOME<\/code>? Spin up a disposable user, install there, delete when done.\n        <\/p>\n        <p style=\"font-size: 14px; color: #6A6055; line-height: 1.6; margin: 0;\">\n          Already installed on your main account? <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 0.92em; background: rgba(28,26,23,0.08); padding: 2px 6px; border-radius: 4px; color: #1C1A17;\">./nanokit uninstall<\/code> rolls it back cleanly — unlinks every dotfile and removes the pixi-global manifest.\n        <\/p>\n      <\/div>\n\n      <div style=\"background: #16140F; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 48px -24px rgba(28,26,23,0.3);\">\n        <div style=\"display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #1F1C16; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <div style=\"display: flex; gap: 6px;\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ED6A5E;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #F4BE4F;\"><\/span><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #61C554;\"><\/span><\/div>\n          <div style=\"flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170;\">root — try then throw away<\/div>\n          <button data-copy=\"sudo adduser nanokit\nsu - nanokit\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8170; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px 10px; cursor: pointer;\" style-hover=\"color: #E7DFCF; border-color: rgba(255,255,255,0.25)\">copy<\/button>\n        <\/div>\n        <pre style=\"margin: 0; padding: 22px 24px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.75; color: #E7DFCF;\"><span style=\"color: #C8868A;\"># 1. create a sandbox user<\/span><br>\n<span style=\"color: #A8C97F;\">root<\/span> <span style=\"color: {{ accent }};\">#<\/span> sudo adduser nanokit\n<span style=\"color: #A8C97F;\">root<\/span> <span style=\"color: {{ accent }};\">#<\/span> su - nanokit\n\n<span style=\"color: #C8868A;\"># 2. inside the sandbox: do step 1–3<\/span><br>\n<span style=\"color: #A8C97F;\">nanokit@host<\/span> <span style=\"color: {{ accent }};\">~<\/span><span style=\"color: {{ accent }};\">$<\/span> curl -fsSL https://pixi.sh/install.sh | sh\n<span style=\"color: #A8C97F;\">nanokit@host<\/span> <span style=\"color: {{ accent }};\">~<\/span><span style=\"color: {{ accent }};\">$<\/span> gh repo clone denkiwakame/nanokit\n<span style=\"color: #A8C97F;\">nanokit@host<\/span> <span style=\"color: {{ accent }};\">~<\/span><span style=\"color: {{ accent }};\">$<\/span> cd nanokit &amp;&amp; ./nanokit install\n\n<span style=\"color: #C8868A;\"># 3. like it? do it on your real account.<\/span><br>\n<span style=\"color: #C8868A;\">#    don't like it? burn it down:<\/span><br>\n<span style=\"color: #A8C97F;\">root<\/span> <span style=\"color: {{ accent }};\">#<\/span> sudo userdel -r nanokit\n<span style=\"color: #8A8170;\">  ✓ removed user and home directory.<\/span><\/pre>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============================ FOOTER ============================ -->\n  <footer style=\"background: #EFEAE0; padding: 64px 32px 48px; border-top: 1px solid rgba(28,26,23,0.08);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 48px; align-items: start;\">\n\n      <div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px;\">nanokit<\/div>\n        <p style=\"font-size: 14px; color: #75695A; line-height: 1.6; margin: 0; max-width: 380px;\">A minimal development environment, powered by pixi. Built by <a href=\"https://github.com/denkiwakame\" style=\"color: #1C1A17; text-decoration: underline; text-decoration-color: rgba(28,26,23,0.3); text-underline-offset: 3px;\">denkiwakame<\/a>. MIT licensed. 2026.<\/p>\n      <\/div>\n\n      <div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }}; letter-spacing: 0.06em; margin-bottom: 14px;\">RESOURCES<\/div>\n        <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px;\">\n          <li><a href=\"https://github.com/denkiwakame/nanokit\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">repository ↗<\/a><\/li>\n          <li><a href=\"https://pixi.sh\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">pixi ↗<\/a><\/li>\n          <li><a href=\"https://starship.rs/presets/\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">starship presets ↗<\/a><\/li>\n          <li><a href=\"https://sheldon.cli.rs/\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">sheldon ↗<\/a><\/li>\n        <\/ul>\n      <\/div>\n\n      <div>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ accent }}; letter-spacing: 0.06em; margin-bottom: 14px;\">NAVIGATE<\/div>\n        <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px;\">\n          <li><a href=\"#tutorial\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">tutorial<\/a><\/li>\n          <li><a href=\"#tools\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">tools<\/a><\/li>\n          <li><a href=\"#workflow\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">workflow<\/a><\/li>\n          <li><a href=\"#sandbox\" style=\"color: #1C1A17; text-decoration: none;\" style-hover=\"color: #CC785C\">sandbox<\/a><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div style=\"max-width: 1180px; margin: 48px auto 0; padding-top: 32px; border-top: 1px solid rgba(28,26,23,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A;\">$ uptime · 0 days, 0 hours, 4 commands<\/div>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #75695A;\">~ nanokit ~<\/div>\n    <\/div>\n  <\/footer>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1280 },\n  &quot;accent&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;#CC785C&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;options&quot;: [\n      { &quot;label&quot;: &quot;clay (default)&quot;, &quot;value&quot;: &quot;#CC785C&quot; },\n      { &quot;label&quot;: &quot;sage&quot;, &quot;value&quot;: &quot;#7A9B6A&quot; },\n      { &quot;label&quot;: &quot;cerulean&quot;, &quot;value&quot;: &quot;#4E84B3&quot; },\n      { &quot;label&quot;: &quot;plum&quot;, &quot;value&quot;: &quot;#A47AB5&quot; },\n      { &quot;label&quot;: &quot;rust&quot;, &quot;value&quot;: &quot;#B8593A&quot; }\n    ]\n  },\n  &quot;showFeatures&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;\n  },\n  &quot;showCheatsheet&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  state = {\n    pixiInstaller: 'curl',\n    cloneTool: 'gh',\n    installMode: 'auto',\n    fontOs: 'linux',\n  };\n\n  componentDidMount() {\n    this._copyListener = (e) => {\n      const btn = e.target.closest('[data-copy]');\n      if (!btn) return;\n      e.preventDefault();\n      const text = btn.dataset.copy;\n      if (!text) return;\n      const decoded = text.replace(/&#10;/g, '\\n');\n      const finish = () => {\n        if (!btn.dataset.label) btn.dataset.label = btn.textContent;\n        btn.textContent = '✓ copied';\n        btn.style.color = '#A8C97F';\n        clearTimeout(this._copyTo);\n        this._copyTo = setTimeout(() => {\n          if (btn.dataset.label) btn.textContent = btn.dataset.label;\n          btn.style.color = '';\n        }, 1400);\n      };\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(decoded).then(finish).catch(() => {\n          this._fallbackCopy(decoded);\n          finish();\n        });\n      } else {\n        this._fallbackCopy(decoded);\n        finish();\n      }\n    };\n    document.addEventListener('click', this._copyListener);\n  }\n\n  _fallbackCopy(text) {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.style.position = 'fixed';\n      ta.style.opacity = '0';\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      document.body.removeChild(ta);\n    } catch (_) {}\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('click', this._copyListener);\n    clearTimeout(this._copyTo);\n  }\n\n  _tabStyle(active) {\n    const accent = this.props.accent || '#CC785C';\n    return active\n      ? `padding: 7px 14px; background: #1C1A17; color: #EFEAE0; border: none; border-radius: 5px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; transition: all 0.15s;`\n      : `padding: 7px 14px; background: transparent; color: #75695A; border: none; border-radius: 5px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; transition: all 0.15s;`;\n  }\n\n  renderVals() {\n    const accent = this.props.accent || '#CC785C';\n    const showFeatures = this.props.showFeatures ?? true;\n    const showCheatsheet = this.props.showCheatsheet ?? true;\n    const s = this.state;\n    return {\n      accent,\n      showFeatures,\n      showCheatsheet,\n\n      isCurl: s.pixiInstaller === 'curl',\n      isWget: s.pixiInstaller === 'wget',\n      isGh: s.cloneTool === 'gh',\n      isGit: s.cloneTool === 'git',\n      isAuto: s.installMode === 'auto',\n      isManual: s.installMode === 'manual',\n      isLinux: s.fontOs === 'linux',\n      isMac: s.fontOs === 'mac',\n      isWin: s.fontOs === 'win',\n\n      curlTabStyle: this._tabStyle(s.pixiInstaller === 'curl'),\n      wgetTabStyle: this._tabStyle(s.pixiInstaller === 'wget'),\n      ghTabStyle: this._tabStyle(s.cloneTool === 'gh'),\n      gitTabStyle: this._tabStyle(s.cloneTool === 'git'),\n      autoTabStyle: this._tabStyle(s.installMode === 'auto'),\n      manualTabStyle: this._tabStyle(s.installMode === 'manual'),\n      linuxTabStyle: this._tabStyle(s.fontOs === 'linux'),\n      macTabStyle: this._tabStyle(s.fontOs === 'mac'),\n      winTabStyle: this._tabStyle(s.fontOs === 'win'),\n\n      setCurl: () => this.setState({ pixiInstaller: 'curl' }),\n      setWget: () => this.setState({ pixiInstaller: 'wget' }),\n      setGh: () => this.setState({ cloneTool: 'gh' }),\n      setGit: () => this.setState({ cloneTool: 'git' }),\n      setAuto: () => this.setState({ installMode: 'auto' }),\n      setManual: () => this.setState({ installMode: 'manual' }),\n      setLinux: () => this.setState({ fontOs: 'linux' }),\n      setMac: () => this.setState({ fontOs: 'mac' }),\n      setWin: () => this.setState({ fontOs: 'win' }),\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
